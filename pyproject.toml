[project]
name = "cogi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Patrick Miller", email = "paddymills@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "pyodbc>=5.2.0",
    "pyperclip>=1.9.0",
    "pywin32>=308",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "xlwings>=0.33.5",
]

[project.scripts]
cogi = "cogi:main"
analysis = "analysis:main"
mbst = "mbst:main"
delete = "robot.delete:main"
revconf = "robot.revconf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
